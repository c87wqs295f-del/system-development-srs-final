<svg viewBox="0 0 1680 1520" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<title>UML Class Diagram — Enterprise Service Request Management System</title>
<defs>
  <marker id="inherit" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="14" markerHeight="14" orient="auto">
    <path d="M0,0 L11,6 L0,12 z" fill="#ffffff" stroke="#141413" stroke-width="1.2"/>
  </marker>
  <marker id="dep" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto">
    <path d="M0,0 L9,5 L0,10" fill="none" stroke="#141413" stroke-width="1.2"/>
  </marker>
  <marker id="compdia" viewBox="0 0 14 10" refX="1" refY="5" markerWidth="16" markerHeight="12" orient="auto">
    <path d="M1,5 L7,1 L13,5 L7,9 z" fill="#141413" stroke="#141413" stroke-width="1"/>
  </marker>
</defs>
<style>
  .cls,.ifc,.enumbox { fill:#ffffff; stroke:#141413; stroke-width:1.2; }
  .title { font-size:14px; font-weight:700; fill:#141413; text-anchor:middle; }
  .titleIt { font-size:14px; font-weight:700; font-style:italic; fill:#141413; text-anchor:middle; }
  .stereo { font-size:11px; fill:#6b6b6b; text-anchor:middle; font-style:italic; }
  .m { font-size:11.5px; fill:#141413; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
  .mi { font-size:11.5px; fill:#141413; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-style:italic; }
  .sep { stroke:#141413; stroke-width:1; }
  .rel { stroke:#141413; stroke-width:1.4; fill:none; }
  .dashed { stroke:#141413; stroke-width:1.4; fill:none; stroke-dasharray:6 4; }
  .card { font-size:11px; fill:#141413; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
  .role { font-size:10.5px; fill:#6b6b6b; font-style:italic; }
  .legend { font-size:11.5px; fill:#141413; }
  .legendTitle { font-size:12px; fill:#141413; font-weight:700; }
</style>
<g>
  <rect class="cls" x="720" y="30" width="240" height="152" rx="4"/>
  <text class="stereo" x="840" y="48">«abstract»</text>
  <text class="titleIt" x="840" y="66">User</text>
  <line class="sep" x1="720" y1="76" x2="960" y2="76"/>
  <text class="m" x="730" y="94">- id: Long</text>
  <text class="m" x="730" y="110">- username: String</text>
  <text class="m" x="730" y="126">- password: String</text>
  <text class="m" x="730" y="142">- fullName: String</text>
  <text class="m" x="730" y="158">- email: String</text>
  <line class="sep" x1="720" y1="166" x2="960" y2="166"/>
  <text class="mi" x="730" y="180"># getRole(): String</text>
</g>
<g>
  <rect class="cls" x="280" y="270" width="220" height="60" rx="4"/>
  <text class="title" x="390" y="290">Employee</text>
  <line class="sep" x1="280" y1="298" x2="500" y2="298"/>
  <text class="m" x="290" y="316"># getRole(): String = "EMP"</text>
</g>
<g>
  <rect class="cls" x="730" y="270" width="220" height="60" rx="4"/>
  <text class="title" x="840" y="290">ServiceAgent</text>
  <line class="sep" x1="730" y1="298" x2="950" y2="298"/>
  <text class="m" x="740" y="316"># getRole(): String = "AGENT"</text>
</g>
<g>
  <rect class="cls" x="1180" y="270" width="220" height="60" rx="4"/>
  <text class="title" x="1290" y="290">Manager</text>
  <line class="sep" x1="1180" y1="298" x2="1400" y2="298"/>
  <text class="m" x="1190" y="316"># getRole(): String = "MGR"</text>
</g>
<path class="rel" d="M 390,270 L 390,220 L 840,220 L 840,182" marker-end="url(#inherit)"/>
<path class="rel" d="M 840,270 L 840,182" marker-end="url(#inherit)"/>
<path class="rel" d="M 1290,270 L 1290,220 L 840,220 L 840,182" marker-end="url(#inherit)"/>
<g>
  <rect class="cls" x="620" y="430" width="340" height="300" rx="4"/>
  <text class="title" x="790" y="450">Request</text>
  <line class="sep" x1="620" y1="460" x2="960" y2="460"/>
  <text class="m" x="630" y="478">- id: Long</text>
  <text class="m" x="630" y="494">- title: String</text>
  <text class="m" x="630" y="510">- description: String</text>
  <text class="m" x="630" y="526">- category: Category</text>
  <text class="m" x="630" y="542">- priority: Priority</text>
  <text class="m" x="630" y="558">- status: Status</text>
  <text class="m" x="630" y="574">- submitter: Employee</text>
  <text class="m" x="630" y="590">- assignee: ServiceAgent</text>
  <text class="m" x="630" y="606">- createdAt: LocalDateTime</text>
  <text class="m" x="630" y="622">- updatedAt: LocalDateTime</text>
  <text class="m" x="630" y="638">- resolvedAt: LocalDateTime</text>
  <text class="m" x="630" y="654">- comments: List&lt;Comment&gt;</text>
  <line class="sep" x1="620" y1="662" x2="960" y2="662"/>
  <text class="m" x="630" y="678">+ transitionTo(s: Status): void</text>
  <text class="m" x="630" y="694">+ assign(a: ServiceAgent): void</text>
  <text class="m" x="630" y="710">+ addComment(c: Comment): void</text>
  <text class="m" x="630" y="726">+ isOverdue(): boolean</text>
</g>
<g>
  <rect class="cls" x="1100" y="460" width="240" height="140" rx="4"/>
  <text class="title" x="1220" y="480">Comment</text>
  <line class="sep" x1="1100" y1="488" x2="1340" y2="488"/>
  <text class="m" x="1110" y="506">- id: Long</text>
  <text class="m" x="1110" y="522">- requestId: Long</text>
  <text class="m" x="1110" y="538">- author: User</text>
  <text class="m" x="1110" y="554">- text: String</text>
  <text class="m" x="1110" y="570">- createdAt: LocalDateTime</text>
  <line class="sep" x1="1100" y1="578" x2="1340" y2="578"/>
</g>
<path class="rel" d="M 1100,530 L 960,530" marker-start="url(#compdia)"/>
<text class="card" x="975" y="524">1</text>
<text class="card" x="1070" y="524">0..*</text>
<path class="rel" d="M 620,560 L 390,560 L 390,330"/>
<text class="card" x="395" y="354">0..*</text>
<text class="card" x="600" y="556">1</text>
<text class="role" x="530" y="556">submitter</text>
<path class="rel" d="M 790,430 L 790,380 L 840,380 L 840,330"/>
<text class="card" x="800" y="374">0..1</text>
<text class="role" x="800" y="410">assignee</text>
<g>
  <rect class="enumbox" x="1440" y="40" width="210" height="170" rx="4"/>
  <text class="stereo" x="1545" y="58">«enumeration»</text>
  <text class="title" x="1545" y="76">Status</text>
  <line class="sep" x1="1440" y1="86" x2="1650" y2="86"/>
  <text class="m" x="1450" y="104">NEW</text>
  <text class="m" x="1450" y="120">ASSIGNED</text>
  <text class="m" x="1450" y="136">IN_PROGRESS</text>
  <text class="m" x="1450" y="152">WAITING_FOR_INFO</text>
  <text class="m" x="1450" y="168">RESOLVED</text>
  <text class="m" x="1450" y="184">CLOSED</text>
</g>
<g>
  <rect class="enumbox" x="1440" y="240" width="210" height="150" rx="4"/>
  <text class="stereo" x="1545" y="258">«enumeration»</text>
  <text class="title" x="1545" y="276">Category</text>
  <line class="sep" x1="1440" y1="286" x2="1650" y2="286"/>
  <text class="m" x="1450" y="304">IT</text>
  <text class="m" x="1450" y="320">FACILITY</text>
  <text class="m" x="1450" y="336">HR</text>
  <text class="m" x="1450" y="352">SUPPLY</text>
  <text class="m" x="1450" y="368">ACCESS</text>
</g>
<g>
  <rect class="enumbox" x="1440" y="420" width="210" height="200" rx="4"/>
  <text class="stereo" x="1545" y="438">«enumeration»</text>
  <text class="title" x="1545" y="456">Priority</text>
  <line class="sep" x1="1440" y1="466" x2="1650" y2="466"/>
  <text class="m" x="1450" y="484">- slaHours: int</text>
  <line class="sep" x1="1440" y1="492" x2="1650" y2="492"/>
  <text class="m" x="1450" y="510">URGENT(4)</text>
  <text class="m" x="1450" y="526">HIGH(24)</text>
  <text class="m" x="1450" y="542">MEDIUM(72)</text>
  <text class="m" x="1450" y="558">LOW(168)</text>
  <line class="sep" x1="1440" y1="566" x2="1650" y2="566"/>
  <text class="m" x="1450" y="584">+ getSlaHours(): int</text>
</g>
<path class="rel" d="M 960,520 L 1440,120"/>
<text class="role" x="1380" y="170">status</text>
<path class="rel" d="M 960,530 L 1440,310"/>
<text class="role" x="1370" y="352">category</text>
<path class="rel" d="M 960,540 L 1440,500"/>
<text class="role" x="1375" y="478">priority</text>
<g>
  <rect class="cls" x="30" y="790" width="300" height="200" rx="4"/>
  <text class="title" x="180" y="810">RequestService</text>
  <line class="sep" x1="30" y1="820" x2="330" y2="820"/>
  <text class="m" x="40" y="838">- requestRepo: RequestRepository</text>
  <text class="m" x="40" y="854">- userRepo: UserRepository</text>
  <line class="sep" x1="30" y1="862" x2="330" y2="862"/>
  <text class="m" x="40" y="880">+ createRequest(...): Request</text>
  <text class="m" x="40" y="896">+ assignRequest(id, agent): void</text>
  <text class="m" x="40" y="912">+ transitionStatus(id, s): void</text>
  <text class="m" x="40" y="928">+ addComment(id, text, by): void</text>
  <text class="m" x="40" y="944">+ listAll(): List&lt;Request&gt;</text>
  <text class="m" x="40" y="960">+ listByAssignee(a): List&lt;Request&gt;</text>
  <text class="m" x="40" y="976">+ listByStatus(s): List&lt;Request&gt;</text>
</g>
<g>
  <rect class="cls" x="30" y="1050" width="300" height="130" rx="4"/>
  <text class="title" x="180" y="1070">AuthService</text>
  <line class="sep" x1="30" y1="1080" x2="330" y2="1080"/>
  <text class="m" x="40" y="1098">- userRepo: UserRepository</text>
  <line class="sep" x1="30" y1="1106" x2="330" y2="1106"/>
  <text class="m" x="40" y="1124">+ login(user, pwd): User</text>
  <text class="m" x="40" y="1140">+ logout(session): void</text>
  <text class="m" x="40" y="1156">+ currentUser(): User</text>
</g>
<g>
  <rect class="ifc" x="500" y="820" width="280" height="180" rx="4"/>
  <text class="stereo" x="640" y="838">«interface»</text>
  <text class="title" x="640" y="856">UserRepository</text>
  <line class="sep" x1="500" y1="866" x2="780" y2="866"/>
  <line class="sep" x1="500" y1="874" x2="780" y2="874"/>
  <text class="m" x="510" y="892">+ findByUsername(u): User</text>
  <text class="m" x="510" y="908">+ findById(id): User</text>
  <text class="m" x="510" y="924">+ save(u: User): void</text>
  <text class="m" x="510" y="940">+ findAll(): List&lt;User&gt;</text>
</g>
<g>
  <rect class="ifc" x="880" y="820" width="320" height="220" rx="4"/>
  <text class="stereo" x="1040" y="838">«interface»</text>
  <text class="title" x="1040" y="856">RequestRepository</text>
  <line class="sep" x1="880" y1="866" x2="1200" y2="866"/>
  <line class="sep" x1="880" y1="874" x2="1200" y2="874"/>
  <text class="m" x="890" y="892">+ findById(id): Request</text>
  <text class="m" x="890" y="908">+ save(r: Request): void</text>
  <text class="m" x="890" y="924">+ update(r: Request): void</text>
  <text class="m" x="890" y="940">+ findAll(): List&lt;Request&gt;</text>
  <text class="m" x="890" y="956">+ findByAssignee(a): List&lt;Request&gt;</text>
  <text class="m" x="890" y="972">+ findBySubmitter(s): List&lt;Request&gt;</text>
  <text class="m" x="890" y="988">+ findByStatus(s): List&lt;Request&gt;</text>
</g>
<g>
  <rect class="cls" x="500" y="1260" width="280" height="80" rx="4"/>
  <text class="title" x="640" y="1280">SqliteUserRepository</text>
  <line class="sep" x1="500" y1="1290" x2="780" y2="1290"/>
  <text class="m" x="510" y="1308">- conn: Connection</text>
  <line class="sep" x1="500" y1="1316" x2="780" y2="1316"/>
</g>
<g>
  <rect class="cls" x="880" y="1260" width="320" height="80" rx="4"/>
  <text class="title" x="1040" y="1280">SqliteRequestRepository</text>
  <line class="sep" x1="880" y1="1290" x2="1200" y2="1290"/>
  <text class="m" x="890" y="1308">- conn: Connection</text>
  <line class="sep" x1="880" y1="1316" x2="1200" y2="1316"/>
</g>
<path class="dashed" d="M 640,1260 L 640,1000" marker-end="url(#inherit)"/>
<path class="dashed" d="M 1040,1260 L 1040,1040" marker-end="url(#inherit)"/>
<path class="dashed" d="M 330,870 L 880,870" marker-end="url(#dep)"/>
<path class="dashed" d="M 330,920 L 500,920" marker-end="url(#dep)"/>
<path class="dashed" d="M 330,1090 L 500,980" marker-end="url(#dep)"/>
<g transform="translate(30, 1320)">
  <rect class="cls" x="0" y="0" width="800" height="180" rx="4"/>
  <text class="legendTitle" x="16" y="24">Legend — UML notation (Session 6)</text>
  <line x1="20" y1="50" x2="100" y2="50" class="rel" marker-end="url(#inherit)"/>
  <text class="legend" x="110" y="54">Inheritance (is-a) — solid line, closed hollow arrow</text>
  <line x1="20" y1="75" x2="100" y2="75" class="dashed" marker-end="url(#inherit)"/>
  <text class="legend" x="110" y="79">Realization (implements) — dashed line, closed hollow arrow</text>
  <line x1="20" y1="100" x2="100" y2="100" class="dashed" marker-end="url(#dep)"/>
  <text class="legend" x="110" y="104">Dependency (uses) — dashed arrow, open head</text>
  <line x1="20" y1="125" x2="100" y2="125" class="rel"/>
  <text class="legend" x="110" y="129">Association (knows) — solid line, cardinalities</text>
  <line x1="20" y1="150" x2="100" y2="150" class="rel" marker-start="url(#compdia)"/>
  <text class="legend" x="110" y="154">Composition (is-part-of) — filled diamond on the whole side</text>
  <text class="legend" x="440" y="54">+ public  |  # protected  |  - private</text>
  <text class="legend" x="440" y="79">«abstract» / italic name = abstract class</text>
  <text class="legend" x="440" y="104">«interface» = interface, «enumeration» = enum</text>
  <text class="legend" x="440" y="129">1  0..1  0..*  1..*  = UML cardinalities</text>
  <text class="legend" x="440" y="154">Getters/setters/ctors omitted (four-question test)</text>
</g>
</svg>
